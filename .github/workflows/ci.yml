name: CI

on:
  push:
    branches: [research-hardening, main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (real PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # backend/package-lock.json is not committed (backend/.gitignore), so install from package.json.
      - run: npm install --no-audit --no-fund
      # Throw-away PostgreSQL 16 started by the test setup; no secrets or services needed.
      - run: npm test
        env:
          EMBEDDINGS: 'off'

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
